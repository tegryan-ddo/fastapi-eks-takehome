apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "mobile-api.fullname" . }}
  labels:
    {{- include "mobile-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # Limits voluntary disruptions (node drains, cluster upgrades) to API pods
  # only; batch pods are not covered.
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "mobile-api.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
