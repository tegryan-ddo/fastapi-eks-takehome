# Copies the runtime secret into the staging namespace. Run by the
# "mobile-api-secrets-sync" CodeBuild project (infra/eks_stack.py), started by
# hand before the first deployment and after every change to the secret:
#
#   aws codebuild start-build --project-name mobile-api-secrets-sync
#   aws codebuild start-build --project-name mobile-api-secrets-sync \
#     --environment-variables-override name=RESTART,value=true   # after a change
#
# This stands in for the cluster secrets integration that docs/operations.md
# assumes. CodeBuild fills the two values from Secrets Manager; they go to
# kubectl on stdin and are never printed or passed as arguments.
version: 0.2

env:
  shell: bash
  secrets-manager:
    DATABASE_URL: "/mobile-api/staging/runtime:DATABASE_URL"
    PAYMENTS_WEBHOOK_SECRET: "/mobile-api/staging/runtime:PAYMENTS_WEBHOOK_SECRET"

phases:
  install:
    runtime-versions:
      python: 3.13
    commands:
      - export PATH="$(python scripts/tools.py --path):$PATH"
  build:
    commands:
      - aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"
      - |
        set -euo pipefail
        printf 'DATABASE_URL=%s\nPAYMENTS_WEBHOOK_SECRET=%s\n' "$DATABASE_URL" "$PAYMENTS_WEBHOOK_SECRET" \
          | kubectl create secret generic mobile-api-runtime -n "$NAMESPACE" \
              --from-env-file=/dev/stdin --dry-run=client -o yaml \
          | kubectl apply -f - >/dev/null
        echo "Secret mobile-api-runtime applied in $NAMESPACE (keys: DATABASE_URL, PAYMENTS_WEBHOOK_SECRET)"
        if [ "${RESTART:-false}" = "true" ] && kubectl get deployment mobile-api -n "$NAMESPACE" >/dev/null 2>&1; then
          # Environment variables are read at container start; roll the pods.
          kubectl rollout restart deployment/mobile-api -n "$NAMESPACE"
          kubectl rollout status deployment/mobile-api -n "$NAMESPACE" --timeout=5m
        fi
