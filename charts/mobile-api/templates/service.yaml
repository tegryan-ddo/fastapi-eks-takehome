apiVersion: v1
kind: Service
metadata:
  name: {{ include "mobile-api.fullname" . }}
  labels:
    {{- include "mobile-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  # component: api keeps future non-HTTP workloads (the batch CronJob) out of
  # this Service even though they share the release labels.
  selector:
    {{- include "mobile-api.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
