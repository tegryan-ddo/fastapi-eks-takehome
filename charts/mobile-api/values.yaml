# Defaults shared by every environment. Files in environments/ override only
# what differs. Never put credentials in values files.

replicaCount: 1

image:
  # Placeholder ECR repository; replace with the real registry.
  repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/mobile-api
  # Used when digest is empty. Defaults to the chart's appVersion.
  tag: ""
  # Full digest, e.g. "sha256:<64 hex characters>". Takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent

service:
  port: 80

# Initial settings, not measurements. Revisit after load testing; see
# docs/decisions.md. No CPU limit, to avoid CFS throttling on latency-sensitive
# requests; one Uvicorn worker cannot use much more than one core anyway.
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    memory: 512Mi

# Startup and liveness use /health/live, which must never depend on Postgres
# or other external services. Readiness gates traffic.
startupProbe:
  httpGet:
    path: /health/live
    port: http
  periodSeconds: 2
  timeoutSeconds: 2
  failureThreshold: 30 # up to 60s to start before the container is restarted

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 2

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Shutdown budget: preStop sleep (5s) + Uvicorn graceful shutdown (20s, set in
# the image's startup command) must fit within terminationGracePeriodSeconds.
preStopSleepSeconds: 5
terminationGracePeriodSeconds: 30
