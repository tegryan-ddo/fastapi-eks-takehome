# Kubernetes permissions for the mobile-api-secrets-sync CodeBuild role, whose
# EKS access entry maps it to the group below. Applied once by a cluster
# administrator. It may write one Secret and restart one Deployment, nothing
# else; the deployer role (platform/deploy-rbac.yaml) has no Secrets access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mobile-api-secrets-sync
  namespace: mobile-api-staging
rules:
  # create cannot be limited by name: the name is not known at authorization time.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [mobile-api-runtime]
    verbs: [get, update, patch]
  # kubectl rollout restart / status after a secret change.
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [mobile-api]
    verbs: [get, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mobile-api-secrets-sync
  namespace: mobile-api-staging
subjects:
  - kind: Group
    name: mobile-api-staging-secrets
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: mobile-api-secrets-sync
  apiGroup: rbac.authorization.k8s.io
