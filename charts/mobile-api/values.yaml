# Defaults shared by every environment. Files in environments/ override only
# what differs. Never put credentials in values files.
#
# Demo application assumption: only the assignment brief was supplied. The
# image built from examples/demo-api demonstrates container startup, health
# checks, shutdown, real PostgreSQL reads and writes, schema migration, and
# batch execution. Payment-provider integration, the real business logic, and
# production throughput are unverified.

image:
  # The ECR repository provisioned by infra/ in this exercise's AWS account.
  repository: 882384879235.dkr.ecr.us-east-1.amazonaws.com/mobile-api
  # Used when digest is empty. Defaults to the chart's appVersion.
  tag: ""
  # Full digest, e.g. "sha256:<64 hex characters>". Takes precedence over tag
  # for the API Deployment, the batch CronJob, and the migration Job.
  digest: ""
  pullPolicy: IfNotPresent

# Kubernetes Secret in the namespace, created by the cluster's secrets
# integration from AWS Secrets Manager (see docs/operations.md). The chart only
# references it by name; a Secret name is not a credential. PostgreSQL is
# required: every workload reads DATABASE_URL from this Secret, and the
# release fails if the Secret is missing.
runtimeSecret:
  name: mobile-api-runtime

service:
  port: 80

# Off by default. The host and the ALB certificate differ per environment and
# are supplied at deploy time through an extra values file; see the example
# in environments/staging.yaml. TLS terminates at the ALB, configured through
# annotations, so the Ingress has no spec.tls.
ingress:
  enabled: false
  className: alb
  host: ""
  annotations: {}

api:
  # Used only when autoscaling.enabled is false.
  replicaCount: 2

  # Initial settings, not measurements; revisit after load testing (see
  # docs/decisions.md). The CPU request is also the HPA's utilization base.
  # No CPU limit, to avoid CFS throttling; one Uvicorn worker cannot use much
  # more than one core anyway.
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 512Mi

  # Keys of runtimeSecret exposed as environment variables.
  secretKeys: [DATABASE_URL, PAYMENTS_WEBHOOK_SECRET]

  # Startup and liveness use /health/live, which never touches PostgreSQL.
  # Readiness gates traffic: it runs a pooled SELECT 1 with a 1.5s budget, so
  # timeoutSeconds 2 covers it. Two failures five seconds apart take a pod out
  # of rotation in about 10s, and it returns automatically once the database
  # answers again.
  startupProbe:
    httpGet:
      path: /health/live
      port: http
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 30 # up to 60s to start before the container is restarted
  readinessProbe:
    httpGet:
      path: /health/ready
      port: http
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 2
  livenessProbe:
    httpGet:
      path: /health/live
      port: http
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  # Shutdown budget: preStop sleep (5s) + Uvicorn graceful shutdown (20s, set
  # in the image's startup command) must fit within the grace period.
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 30

autoscaling:
  # HPA assumption: CPU utilization is the initial HPA signal. Confirm or
  # refine it with the app team and representative load tests; database or
  # I/O waits may increase latency without increasing CPU. maxReplicas must
  # fit the Postgres connection budget: each pod holds up to
  # DATABASE_POOL_MAX (5) connections. Requires the Kubernetes resource
  # metrics API (metrics-server) in the cluster.
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 60 # initial assumption

podDisruptionBudget:
  maxUnavailable: 1

# Schema migration, run as a Helm pre-install/pre-upgrade hook Job before any
# API or batch pod changes. Never run from API pods or health endpoints.
migrate:
  secretKeys: [DATABASE_URL]
  activeDeadlineSeconds: 600
  # Failed hook Jobs stay for diagnosis, then are removed after a day.
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 128Mi

batch:
  # Assumptions to confirm with the application team: schedule, time zone,
  # business-date semantics, expected duration, and completion deadline.
  schedule: "30 2 * * *" # daily at 02:30
  timeZone: Etc/UTC
  suspend: false
  command: ["python", "-m", "app.batch"]
  startingDeadlineSeconds: 3600 # skip a run that cannot start within an hour
  backoffLimit: 2 # at most 3 attempts
  activeDeadlineSeconds: 3600 # stop a run, including retries, after an hour
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  ttlSecondsAfterFinished: 604800 # delete finished Jobs, manual ones too, after 7 days
  # Only the keys the job needs.
  secretKeys: [DATABASE_URL]
  # Initial settings, not measurements.
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 256Mi
