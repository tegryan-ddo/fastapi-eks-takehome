apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mobile-api.fullname" . }}
  labels:
    {{- include "mobile-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # With autoscaling, replicas is omitted so an upgrade does not reset the
  # replica count the HPA is managing.
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mobile-api.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the current ready count; start replacements first.
      maxUnavailable: 0
      maxSurge: 25%
  template:
    metadata:
      labels:
        {{- include "mobile-api.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "mobile-api.fullname" . }}
      # The API does not call the Kubernetes API.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "mobile-api.podSecurityContext" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "mobile-api.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          {{- if and .Values.runtimeSecret.name .Values.api.secretKeys }}
          {{- include "mobile-api.secretEnv" (dict "secret" .Values.runtimeSecret.name "keys" .Values.api.secretKeys) | nindent 10 }}
          {{- end }}
          startupProbe:
            {{- toYaml .Values.api.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "mobile-api.containerSecurityContext" . | nindent 12 }}
          lifecycle:
            # Keep serving while the pod is removed from Service endpoints,
            # then Uvicorn receives SIGTERM and drains in-flight requests.
            preStop:
              sleep:
                seconds: {{ .Values.api.preStopSleepSeconds }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # The root filesystem is read-only; tempfile users (for example
        # Starlette multipart uploads over 1MB) write here.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
